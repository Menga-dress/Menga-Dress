name: Modello riconoscimento capi

# Scarica il modello gratuito MobileCLIP S0 e prepara web/modello/ (immagini.onnx + testi.json).
# Parte da solo quando cambiano tools/modello/ su un ramo, oppure a mano da Actions.
on:
  push:
    branches-ignore: [main]
    paths: ['tools/modello/**', '.github/workflows/modello.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @huggingface/transformers@3.7.6
      - run: node tools/modello/prepara.mjs
        env:
          CANDIDATI: ${{ vars.CANDIDATI || 'Xenova/mobileclip_s0:fp16' }}
      - name: Salva il modello nel ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add web/modello
          git diff --cached --quiet || (git commit -m "Modello per riconoscere i capi" && git push)
